[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devote-face-recognition"
version = "1.0.0"
description = "DeVote voter face registration & verification CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "opencv-python>=4.9",
  "numpy>=1.26,<2.0",
  "deepface>=0.0.93",
  "mtcnn>=0.1.1",
  "tensorflow>=2.16",
]

[project.scripts]
devote-face = "face_id:main"

[tool.setuptools]
py-modules = ["face_id"]

[tool.ruff]
line-length = 100
target-version = "py310"
