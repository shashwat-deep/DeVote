services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: devote-web:latest
    container_name: devote-web
    ports:
      - '8080:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
